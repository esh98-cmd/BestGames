<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>BestGames</title>
  </head>
  <body>
    <header>
      <div class="header">
        <div class="logo-section">
          <div class="logo-img">
            <img src="img/controler.svg" alt="Логотип" />
          </div>
          <div class="text-logo">
            Best<span class="text-style-logo">Games</span>
          </div>
        </div>
        <div class="btn-section">
          <ul class="btn-section-list">
            <li class="btn-section-list-item">
              <button class="btn-section-list-item-link-btn">Поиск</button>
            </li>
            <li class="btn-section-list-item">
              <button class="btn-section-list-item-link-btn-sign">Войти</button>
            </li>
            <li class="btn-section-list-item">
              <button class="btn-section-list-item-link-btn-lich">
                Личный кабинет
              </button>
            </li>
            <li class="btn-section-list-item">
              <button class="btn-section-list-item-link-btn-cat">
                Каталог игр
              </button>
            </li>
            <li class="btn-section-list-item">
              <button class="btn-section-list-item-link-btn-sun">
                <div class="btn-section-list-item-link-btn-sun-sun">
                  <img
                    src="img/sun.svg"
                    alt="Солнце"
                    class="btn-section-list-item-link-btn-sun-img"
                  />
                </div>
                <div class="btn-section-list-item-link-btn-sun-text">
                  Светлая тема
                </div>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <main>
      <div class="banner-section">
        <div class="banner-active">
          <div class="back-item">
            <img src="img/btn banner back.svg" alt="" />
          </div>
          <div class="banner">
            <div class="first-section-banner"></div>
            <div class="second-section-banner">
              <div class="text-banner">
                <div class="new-game-text">новинка</div>
                <p class="banner-game-title">Resident Evil 9</p>
                <p class="description-game-banner">Описание</p>
                <p class="price-game">Цена ₽</p>
                <div class="more-game">
                  <button class="more-game-btn">Подробнее</button>
                </div>
              </div>
            </div>
          </div>
          <div class="next-item">
            <img src="img/btn banner next.svg" alt="" />
          </div>
        </div>
        <div class="banner-count">
          <ul class="banner-count-list">
            <li class="banner-count-list-item">
              <div class="banner-count-item active"></div>
            </li>
            <li class="banner-count-list-item">
              <div class="banner-count-item"></div>
            </li>
            <li class="banner-count-list-item">
              <div class="banner-count-item"></div>
            </li>
            <li class="banner-count-list-item">
              <div class="banner-count-item"></div>
            </li>
          </ul>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
